[package]
name = "ai-dev"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Оркестратор AI dev loop: одна итерация issue → PR → CI → ревью → merge"
license = "MIT"
repository = "https://github.com/jack5505/ai-dev-loop-rust"
default-run = "ai-dev"

[lib]
name = "ai_dev"
path = "src/lib.rs"

[[bin]]
name = "ai-dev"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
