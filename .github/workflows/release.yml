name: release

# Сборку на сервере не делаем (там нет ни линковщика, ни прав на apt):
# бинарник приезжает отсюда. musl → статический, без зависимости от glibc.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: |
          install -m 0755 target/x86_64-unknown-linux-musl/release/ai-dev ai-dev
          sha256sum ai-dev > ai-dev.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ai-dev-x86_64-unknown-linux-musl
          path: |
            ai-dev
            ai-dev.sha256
      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ai-dev
            ai-dev.sha256
